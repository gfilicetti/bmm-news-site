server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Block access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to development file extensions
    location ~* \.(py|sh|conf|env|yml|yaml|md|log|config)$ {
        deny all;
        return 404;
    }
}
